<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171b2d">
<title>Recuerdos en fotografías</title>
<style>
:root{color-scheme:dark;--bg:#101321;--panel:#191e31;--ink:#f5f1e9;--muted:#b7bdcc;--gold:#d8b878}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#34415d 0,transparent 55%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:64px 22px 38px;text-align:center}header .eyebrow{color:var(--gold);letter-spacing:.22em;text-transform:uppercase;font-size:.72rem}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(2.3rem,6vw,4.5rem);line-height:1.05;margin:14px 0}header p{color:var(--muted);max-width:620px;margin:14px auto 0}
main{max-width:1300px;margin:auto;padding:0 22px 70px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px;color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.photo{border:1px solid #ffffff18;background:var(--panel);padding:8px;border-radius:14px;cursor:pointer;transition:transform .2s,border-color .2s}.photo:hover{transform:translateY(-3px);border-color:#d8b87888}.photo img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:9px}.photo span{display:block;padding:9px 5px 3px;color:#d8dbea;font-size:.85rem}
footer{text-align:center;color:var(--muted);padding:0 20px 35px;font-size:.85rem}
.viewer{position:fixed;inset:0;background:#070912f2;display:none;align-items:center;justify-content:center;padding:24px;z-index:5}.viewer.open{display:flex}.viewer img{max-width:92vw;max-height:86vh;object-fit:contain;box-shadow:0 20px 80px #0009}.close,.prev,.next{position:absolute;border:1px solid #ffffff55;background:#171b2dcc;color:white;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer}.close{top:18px;right:18px}.prev{left:18px}.next{right:18px}.counter{position:absolute;bottom:14px;color:#ddd}
@media(max-width:600px){header{padding-top:44px}.grid{grid-template-columns:1fr}.prev{left:8px}.next{right:8px}}
</style>
</head>
<body>
<header><div class="eyebrow">Álbum familiar</div><h1>Recuerdos en fotografías</h1><p>Un recorrido por momentos, paisajes y encuentros que merecen seguir siendo recordados.</p></header>
<main><div class="toolbar"><span>Archivo fotográfico</span><span>12 fotografías · Tocá una para ampliar</span></div><section class="grid" id="gallery" aria-label="Galería de fotografías"></section></main>
<footer>Un pequeño álbum para conservar grandes recuerdos.</footer>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Fotografía ampliada"><button class="close" aria-label="Cerrar">×</button><button class="prev" aria-label="Anterior">‹</button><img id="large" alt="Fotografía ampliada"><button class="next" aria-label="Siguiente">›</button><div class="counter" id="counter"></div></div>
<script>
const files = Array.from({length:12},(_,i)=>`img${String(i+14).padStart(5,'0')}.webp`);
const gallery=document.querySelector('#gallery'), viewer=document.querySelector('#viewer'), large=document.querySelector('#large'), counter=document.querySelector('#counter');
let current=0;
files.forEach((file,i)=>{const card=document.createElement('button');card.className='photo';card.type='button';card.innerHTML=`<img loading="lazy" src="fotos/${file}" alt="Fotografía familiar ${i+1}"><span>Fotografía ${String(i+1).padStart(2,'0')}</span>`;card.addEventListener('click',()=>open(i));gallery.append(card)});
function open(i){current=i;large.src='fotos/'+files[current];counter.textContent=`${current+1} / ${files.length}`;viewer.classList.add('open');document.body.style.overflow='hidden'}
function close(){viewer.classList.remove('open');document.body.style.overflow=''}
function move(n){open((current+n+files.length)%files.length)}
document.querySelector('.close').onclick=close;document.querySelector('.prev').onclick=()=>move(-1);document.querySelector('.next').onclick=()=>move(1);
viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
</script>
</body></html>
